media:
  input: assets
  output: /assets
  rename: safe
content:
  - name: products
    label: Products
    type: file
    path: content/products.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: Stable product ID
        type: string
        required: true
        description: Unique lowercase identifier; do not change after publishing.
      - name: brand
        label: Brand (leave blank if unknown)
        type: string
      - name: name
        label: Product name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: tidy
              label: Tidy Space
            - name: cozy
              label: Cozy Ambience
            - name: ritual
              label: Slow Ritual
            - name: green
              label: Green Corner
      - name: description
        label: Short description
        type: text
        required: true
      - name: benefits
        label: Key benefits
        type: string
        list: true
      - name: who_for
        label: Who it may suit
        type: string
        list: true
      - name: who_skip
        label: Who may want to skip it
        type: string
        list: true
      - name: check_before
        label: What to check before buying
        type: string
        list: true
      - name: how_to
        label: How to use it
        type: string
        list: true
      - name: thumb
        label: Grid thumbnail (generated automatically)
        type: string
        description: Created by scripts/optimize_images.py. Leave as is.
      - name: image
        label: Product image
        type: image
        description: Product-specific image; verify accuracy and rights before public launch.
      - name: status
        label: Editorial status
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Draft
            - name: published
              label: Published
      - name: retailer_url
        label: Verified retailer link
        type: string
        description: Leave blank until verified. Never paste fabricated affiliate URLs.
  - name: articles
    label: Journal drafts
    type: file
    path: content/articles.json
    format: json
    list: true
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: cover_image
        label: Featured image
        type: image
        description: Journal cover; use an image with suitable commercial-use rights.
      - name: related_products
        label: Related product IDs (shown under the story)
        type: string
        list: true
      - name: body
        label: Article content
        type: rich-text
      - name: status
        label: Editorial status
        type: select
        options:
          values:
            - name: draft
              label: Draft
            - name: published
              label: Published

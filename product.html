<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product - Ohhgood!</title>
<meta name="description" content="Ohhgood! independent finds. No pressure, no made-up ratings.">
<link rel="stylesheet" href="styles.css">
<style>
  .product-page{max-width:760px;margin:0 auto;padding:24px 18px 64px;background:#FFFDF8}
  .crumb{font-size:13px;opacity:.7;margin-bottom:16px}.crumb a{color:inherit}
  .eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.7;text-transform:uppercase}
  .product-page h1{font-size:30px;line-height:1.2;margin:8px 0 10px;font-family:Georgia,serif}
  .disclosure{font-size:12px;line-height:1.5;opacity:.65;margin:0 0 18px}
  .intro{font-size:16px;line-height:1.65;margin:0 0 20px}
  .product-hero{width:100%;border-radius:16px;display:block;margin:0 0 16px;aspect-ratio:16/10;object-fit:cover;background:#F7F0E6}
  .cta-below-img{display:block;text-align:center;background:#121212;color:#fff;text-decoration:none;font-weight:700;padding:16px 20px;border-radius:999px;margin:0 0 8px}
  .cta-note{font-size:12px;text-align:center;opacity:.65;margin:0 0 32px}
  .product-page h2{font-size:20px;margin:36px 0 10px;font-family:Georgia,serif}
  .product-page h3{font-size:16px;margin:20px 0 8px}
  .product-page p,.product-page li{font-size:15px;line-height:1.65}
  .product-page ul,.product-page ol{padding-left:20px;margin:0 0 16px}.product-page li{margin-bottom:8px}
  .box{border:1px solid #E8E0D6;border-radius:14px;padding:18px;margin:0 0 20px;background:#fff}
  .spec-table{width:100%;border-collapse:collapse;font-size:14px}.spec-table td{padding:10px 0;border-bottom:1px solid #eee;vertical-align:top}.spec-table td:first-child{font-weight:700;width:38%;padding-right:12px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .related{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .related a{text-decoration:none;color:inherit;display:block;border-radius:12px;overflow:hidden;border:1px solid #eee}
  .related img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .related span{display:block;background:#121212;color:#fff;font-size:13px;line-height:1.35;padding:10px 12px}
  .notfound{text-align:center;padding:60px 20px}
  @media(max-width:600px){.two-col,.related{grid-template-columns:1fr}.product-page h1{font-size:24px}}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="index.html" class="logo">Back to Ohhgood!</a><nav class="desktop-nav"><a href="index.html#categories">Categories</a><a href="index.html#featured">Finds</a><a href="index.html#journal">Journal</a></nav></div></header>
<main class="product-page" id="app"><p style="padding:40px 0;text-align:center">Loading product...</p></main>
<footer class="footer"><div class="container footer-inner"><p>Ohhgood! Independent discoveries. No pressure, no made-up ratings.</p><a href="standards.html">Editorial standards and disclosures</a></div></footer>
<script>
function clean(s){ if(!s) return ""; return String(s).replace(/—/g, ",").replace(/–/g, "-").replace(/\[entity-[^\]]+\]/g, "Amazon"); }
function catLabel(c){ return {tidy:"Tidy Space", cozy:"Cozy Ambience", ritual:"Slow Ritual", green:"Green Corner"}[c] || c; }
function slugToId(){ return new URLSearchParams(location.search).get("id") || ""; }
async function load(){
  let data=null;
  for(const url of ["content/products.json","products.json","./content/products.json"]){
    try{ const r=await fetch(url); if(r.ok){ data=await r.json(); break; } }catch(e){}
  }
  const app=document.getElementById("app");
  if(!data){ app.innerHTML='<div class="notfound"><h2>Products file not found</h2><p>Upload content/products.json from CMS export, then refresh.</p><p><a href="index.html">Back to all finds</a></p></div>'; return; }
  const id=slugToId();
  const p=data.find(x=>x.id===id) || data[0];
  if(!p){ app.innerHTML='<div class="notfound"><h2>Product not found</h2><p><a href="index.html">Back to all finds</a></p></div>'; return; }
  document.title = clean(p.brand+" "+p.name+" - Ohhgood!");
  const benefits=(p.benefits||[]).map(b=>"<li>"+clean(b)+"</li>").join("");
  const how=(p.how_to||"Pick your spot on a flat, clean surface. Set it up without tools. Test it with your daily items. Use it for a few days and adjust the position if needed.").split("\n").filter(Boolean);
  const howHtml=how.map((s,i)=>"<li><strong>Step "+(i+1)+":</strong> "+clean(s)+"</li>").join("");
  const whoFor=(p.who_for||"You use this spot every day. You want a calmer, tidier space. You prefer simple tools that do one job well.").split("\n").filter(Boolean).map(s=>"<li>"+clean(s)+"</li>").join("");
  const whoSkip=(p.who_skip||"You need a heavy duty solution. Your surface is rough or curved. You need to hide a lot of cables at once.").split("\n").filter(Boolean).map(s=>"<li>"+clean(s)+"</li>").join("");
  const check=(p.check_before||"Count your items first. Check the size and material. Check the surface where you will place it. Check the color against your desk.").split("\n").filter(Boolean).map(s=>"<li>"+clean(s)+"</li>").join("");
  const faqs=p.faq||[{q:"Will it fit my desk?",a:"In most cases yes, if your desk is flat and you have a small spot for it. Measure your space first, then check the size on Amazon."},{q:"Is it good for renters?",a:"Yes, most of these finds are renter friendly. No drill, no holes, easy to remove."},{q:"What if I do not like it?",a:"Check the return policy on Amazon before you buy. Keep the box until you are sure."}];
  const faqHtml=faqs.map(f=>"<h3>"+clean(f.q)+"</h3><p>"+clean(f.a)+"</p>").join("");
  const related=data.filter(x=>x.category===p.category && x.id!==p.id).slice(0,3);
  const relHtml=related.map(r=>'<a href="product.html?id='+encodeURIComponent(r.id)+'"><img src="'+clean(r.image)+'" alt="'+clean(r.name)+'"><span>'+clean(r.brand+" "+r.name)+'</span></a>').join("");
  app.innerHTML = `
  <p class="crumb"><a href="index.html">Home</a> / <a href="index.html#featured">${catLabel(p.category)}</a> / ${clean(p.name)}</p>
  <p class="eyebrow">${catLabel(p.category)} - Desk Finds</p>
  <h1>${clean(p.brand)} ${clean(p.name)}</h1>
  <p class="disclosure">(paid link) As an Amazon Associate I earn from qualifying purchases. Check price, stock, and details on Amazon before buying, listings can change.</p>
  <p class="intro">${clean(p.description)}</p>
  <img class="product-hero" src="${clean(p.image)}" alt="${clean(p.name)}">
  <a class="cta-below-img" href="${clean(p.retailer_url)}" target="_blank" rel="nofollow sponsored noopener">View at Retailer</a>
  <p class="cta-note">Opens Amazon in a new tab. Price and stock are on Amazon.</p>
  <div class="box"><h2 style="margin-top:0">Why we like it</h2><ul>${benefits}</ul></div>
  <h2>How it actually works on a real desk</h2><p>This is a simple, low effort find. It does one job well, and it fits a calm home without adding clutter. Set it up once, then forget about it.</p><ol>${howHtml}</ol>
  <h2>Who it is for, and who should skip it</h2><div class="two-col"><div class="box"><h3 style="margin-top:0">Good for you if:</h3><ul>${whoFor}</ul></div><div class="box"><h3 style="margin-top:0">Skip it if:</h3><ul>${whoSkip}</ul></div></div>
  <h2>What to check before buying</h2><ul>${check}</ul>
  <h2>Quick specs</h2><table class="spec-table"><tr><td>Brand</td><td>${clean(p.brand)}</td></tr><tr><td>Category</td><td>${catLabel(p.category)}</td></tr><tr><td>Best for</td><td>${clean(p.description)}</td></tr><tr><td>Install</td><td>No drill, renter friendly in most cases</td></tr></table>
  <h2>FAQ</h2>${faqHtml}
  <h2>Related finds in ${catLabel(p.category)}</h2><div class="related">${relHtml || "<p>No related finds yet.</p>"}</div>
  <p style="margin-top:28px"><a href="index.html#featured">Back to all finds</a></p>`;
}
load();
</script>
</body></html>

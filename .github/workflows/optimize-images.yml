name: Generate product thumbnails
# Runs when product images or product data change (for example after an upload from /admin/).
# It only adds assets/thumbs/*.webp and the `thumb` field in content/products.json, then commits them back.
on:
  push:
    branches: [main, development]
    paths:
      - 'assets/**'
      - 'content/products.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thumbs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  thumbs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/optimize_images.py
      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs content/products.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate product thumbnails"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

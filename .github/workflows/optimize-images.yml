name: Optimize website imagery
on:
  push:
    branches: [development]
    paths:
      - 'scripts/optimize_images.py'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate WebP and update references
        run: python scripts/optimize_images.py
      - name: Commit optimized images and website references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp styles.css index.html content/products.json
          if ! git diff --cached --quiet; then
            git commit -m "Optimize Ohhgood imagery to lightweight WebP"
            git push origin HEAD:development
          fi

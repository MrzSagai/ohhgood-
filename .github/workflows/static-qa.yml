name: Static QA
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (thumbnail check)
        run: python -m pip install 'Pillow>=11,<13'
      - name: Static QA (content, links, SEO, headers, redirects)
        run: python3 scripts/qa.py
      - name: Render tests for Pages Functions
        run: node --test tests/render.test.mjs

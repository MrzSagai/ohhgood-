name: V7 launch static QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Verify site routes, links, CMS and release rules
        run: |
          python3 - <<'PY'
          import json,os,re,html
          from urllib.parse import unquote
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__();self.links=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.add(a['id'])
                  for key in ['href','src']:
                      if key in a and tag in ('a','script','link','img'):self.links.append(a[key])
          pages={}
          for name in ['index.html','journal.html','standards.html','privacy.html','contact.html']:
              assert os.path.isfile(name),name
              p=Links();p.feed(open(name,encoding='utf-8').read());pages[name]=p
          for name,parsed in pages.items():
              for ref in parsed.links:
                  if not ref or ref.startswith(('http:','https:','data:','mailto:','#')):continue
                  dest=ref.split('?')[0].split('#')[0]
                  if dest.startswith('/product/') and os.path.isfile('functions/product/[id].js'):continue
              if dest:assert os.path.exists(unquote(dest)),(name,ref)
          home=pages['index.html']
          for target in ['featured','categories','journal','about','product-grid','modal-backdrop','mobile-nav']:
              assert target in home.ids,target
          for name in ['products','articles']:
              with open('content/'+name+'.json',encoding='utf-8') as h: data=json.load(h)
              assert isinstance(data,list),name
          products=json.load(open('content/products.json'))
          assert len({p['id'] for p in products})==len(products)
          assert os.path.isfile('functions/product/[id].js'), 'Dynamic product route handler missing'
          product_ids={p['id'] for p in products}
          for parsed in pages.values():
              for ref in parsed.links:
                  if ref.startswith('/product/'):
                      assert ref.split('/')[2] in product_ids,('Unknown product route',ref)
          assert all(p['status'] in ('draft','published') for p in products)
          assert all(p.get('retailer_url','').startswith('https://') for p in products if p['status']=='published')
          assert 'As an Amazon Associate I earn from qualifying purchases.' in html.unescape(open('index.html',encoding='utf-8').read())
          assert 'privacy.html' in open('index.html',encoding='utf-8').read()
          assert 'contact.html' in open('index.html',encoding='utf-8').read()
          articles=json.load(open('content/articles.json'))
          assert len({a['slug'] for a in articles})==len(articles)
          assert all(re.fullmatch('[a-z0-9-]+',a['slug']) for a in articles)
          for a in articles:
              assert isinstance(a.get('title',''),str) and a.get('title','').strip(),('Article title missing',a['slug'])
              assert a.get('status') in ('draft','published'),('Invalid article status',a['slug'])
          # Published articles are rendered from content/articles.json by journal.html.
          assert 'content/articles.json' in open('journal.html',encoding='utf-8').read()
          js=open('app.js',encoding='utf-8').read()
          assert 'const showDraftPreviews=isCloudflarePreview;' in js
          assert "p.status==='published'&&typeof p.retailer_url==='string'" in js
          assert 'loadJournal()' in js
          assert "cta.rel='noopener noreferrer sponsored'" in js
          # V7: audit production asset paths, not only literal HTML <img> tags.
          css=open('styles.css',encoding='utf-8').read()
          from urllib.parse import urlsplit,parse_qs
          css_urls=[m.strip().strip('\"').strip("'") for m in re.findall(r'url\(([^)]+)\)',css)]
          for url in css_urls:
              if url.startswith(('data:','http:','https:','#')):continue
              path=unquote(url.split('?')[0].split('#')[0])
              assert os.path.isfile(path),('CSS asset missing',path)
          js_assets=set(re.findall(r'assets/[a-zA-Z0-9_.%/-]+\.(?:webp|png|svg)',js))
          for path in js_assets:
              assert os.path.isfile(unquote(path)),('JS asset missing',path)
          for product in products:
              assert os.path.isfile(unquote(product['image'])),('Product image missing',product['id'])
              assert isinstance(product.get('benefits'),list),('Invalid benefits',product['id'])
              url=product.get('retailer_url','')
              if url:
                  parsed=urlsplit(url)
                  assert parsed.scheme=='https' and parsed.hostname,('Bad retailer URL',product['id'])
                  if parsed.hostname in ('amazon.com','www.amazon.com'):
                      assert parse_qs(parsed.query).get('tag')==['ohhgood0c-20'],('Unexpected Amazon tracking ID',product['id'])
          for article in articles:
              cover=article.get('cover_image','')
              if cover and not cover.startswith(('https://','http://')):
                  assert os.path.isfile(unquote(cover.lstrip('/'))),('Article cover missing',article['slug'])
          assert 'Allow: /' in open('robots.txt',encoding='utf-8').read() and 'Disallow: /' not in open('robots.txt',encoding='utf-8').read(), 'Production robots must allow crawling'
          for name in ('index.html','journal.html','standards.html','privacy.html','contact.html'):
              assert 'noindex' not in open(name,encoding='utf-8').read().lower(),('Unexpected noindex on production page',name)
          print('V7 static QA passed: routes, CMS, image assets, affiliate tags, production indexability')
          PY

 <rect x="260" y="190" width="300" height="420" rx="18" fill="#b9a68c" opacity=".35" transform="translate(14 18)"/>
 <rect x="250" y="175" width="300" height="420" rx="16" fill="#c9bba5"/>
 <rect x="270" y="190" width="270" height="390" rx="10" fill="#e4d9c7"/>
 <path d="M270 210 Q400 195 540 210" fill="none" stroke="#f8f1e6" stroke-width="5" opacity=".8"/>
 <path d="M300 275 H510" stroke="#b6a58d" stroke-width="2" opacity=".7"/>
 <text x="405" y="355" text-anchor="middle" fill="#6d5b49" font-family="Georgia,serif" font-size="35">Reading</text>
 <text x="405" y="395" text-anchor="middle" fill="#8d7962" font-family="Georgia,serif" font-size="22" font-style="italic">journal</text>
 <path d="M490 580 L520 650 L540 580" fill="#a96f61"/>
 <path d="M285 190 V580" stroke="#b5a58e" stroke-width="4" opacity=".5"/>
 </g>
 <path d="M580 510 Q640 470 660 420" stroke="#a8a17d" stroke-width="3" fill="none"/>

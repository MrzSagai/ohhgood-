<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Linen reading journal</title><desc id="desc">Minimal linen-covered hardcover reading journal with a ribbon marker</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f2e9"/><stop offset="1" stop-color="#e9e0d1"/></linearGradient>
 <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e8dfd1"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#9b704c"/><stop offset=".5" stop-color="#69452f"/><stop offset="1" stop-color="#b4875d"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
 </defs>
 <rect width="800" height="800" rx="36" fill="url(#bg)"/>
 <circle cx="620" cy="175" r="120" fill="#fffaf0" opacity=".35"/>
 <path d="M0 630 Q210 580 410 625 T800 600 V800 H0Z" fill="#d9cdbb" opacity=".42"/>
 <ellipse cx="402" cy="660" rx="230" ry="34" fill="#6c5742" opacity=".17" filter="url(#shadow)"/>
 

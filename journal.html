<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index, follow">
<meta name="description" content="Thoughtful tips and little discoveries from Ohhgood!">
<link rel="canonical" href="https://ohhgood.store/journal.html">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Ohhgood!">
<meta property="og:title" content="Good Journal — Ohhgood!">
<meta property="og:description" content="Practical ideas for calmer everyday routines and better-organized spaces.">
<meta name="twitter:card" content="summary">
<title>Good Journal — Ohhgood!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .journal-link-list{list-style:none;padding:0;margin:0}
  .journal-link-list li{margin:0 0 22px;line-height:1.6}
  .journal-link-list a{color:#0b57d0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .journal-link-list a:hover{color:#000;text-decoration-thickness:2px}
</style>
<script>
"use strict";
const safeSlug=(value)=>/^[a-z0-9-]+$/.test(value||"");
const setMeta=(selector,attribute,value)=>{const element=document.querySelector(selector);if(element)element.setAttribute(attribute,value);};
function addTextBlock(parent,tag,value){const node=document.createElement(tag);node.textContent=value;parent.appendChild(node);}
function appendSafeRichText(target,source){
 const parsed=new DOMParser().parseFromString(source,"text/html");
 const allowed=new Set(["P","H2","H3","UL","OL","LI","STRONG","B","EM","I","A","BLOCKQUOTE"]);
 const copyNode=(sourceNode,parent)=>{
  if(sourceNode.nodeType===Node.TEXT_NODE){parent.appendChild(document.createTextNode(sourceNode.nodeValue||""));return;}
  if(sourceNode.nodeType!==Node.ELEMENT_NODE)return;
  const tag=sourceNode.tagName;
  if(!allowed.has(tag)){Array.from(sourceNode.childNodes).forEach((child)=>copyNode(child,parent));return;}
  const safe=document.createElement(tag.toLowerCase());
  if(tag==="A"){
   const href=sourceNode.getAttribute("href")||"";
   try{const url=new URL(href,location.href);if(url.protocol==="https:"||url.origin===location.origin){safe.href=url.href;safe.rel="noopener noreferrer";}}catch{}
  }
  Array.from(sourceNode.childNodes).forEach((child)=>copyNode(child,safe));parent.appendChild(safe);
 };
 if(parsed.body.children.length){Array.from(parsed.body.childNodes).forEach((node)=>copyNode(node,target));return;}
 const plain=parsed.body.textContent||source;
 plain.split(/\n\s*\n/).map((part)=>part.trim()).filter(Boolean).forEach((part)=>addTextBlock(target,"p",part));
}
(async()=>{
 const title=document.getElementById("article-title"),summary=document.getElementById("article-summary"),body=document.getElementById("article-body"),cover=document.getElementById("article-cover");
 const slug=new URLSearchParams(location.search).get("slug")||"";if(!slug)return;
 if(!safeSlug(slug)){setMeta('meta[name="robots"]',"content","no"+"index,follow");title.textContent="Story not found.";summary.textContent="";body.textContent="The story you are looking for could not be found.";return;}
 try{
  const response=await fetch("content/articles.json",{headers:{Accept:"application/json"}});
  if(!response.ok)throw new Error("Journal data request failed ("+response.status+").");
  const list=await response.json();if(!Array.isArray(list))throw new Error("Invalid journal data.");
  const item=list.find((article)=>article&&article.status==="published"&&article.slug===slug&&typeof article.title==="string");
  if(!item){setMeta('meta[name="robots"]',"content","no"+"index,follow");title.textContent="Story not found.";summary.textContent="";body.textContent="The story you are looking for could not be found.";return;}
  title.textContent=item.title;summary.textContent=typeof item.summary==="string"?item.summary:"";
  document.title=item.title+" — Good Journal — Ohhgood!";
  const canonicalURL=location.origin+location.pathname+"?slug="+encodeURIComponent(slug);
  const canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=canonicalURL;
  setMeta('meta[name="description"]',"content",(item.summary||item.title).slice(0,160));
  setMeta('meta[property="og:title"]',"content",item.title+" — Ohhgood!");
  setMeta('meta[property="og:description"]',"content",(item.summary||"").slice(0,200));
  setMeta('meta[property="og:url"]',"content",canonicalURL);
  cover.replaceChildren();
  if(typeof item.cover_image==="string"){
   const local=/^\/?assets\/[a-zA-Z0-9_./% -]+$/.test(item.cover_image)&&!item.cover_image.includes("..");
   const unsplash=/^https:\/\/images\.unsplash\.com\/photo-[a-zA-Z0-9-]+(?:\?|$)/.test(item.cover_image);
   if(local||unsplash){const image=document.createElement("img");image.src=item.cover_image;image.alt="";image.className="article-cover-photo";image.loading="lazy";image.decoding="async";cover.appendChild(image);}
  }
  body.replaceChildren();appendSafeRichText(body,typeof item.body==="string"?item.body:"");
  const schema={"@context":"https://schema.org","@type":"Article","headline":item.title,"description":item.summary||"","mainEntityOfPage":canonicalURL,...(item.cover_image?{"image":item.cover_image}:{}),"publisher":{"@type":"Organization","name":"Ohhgood!","url":"https://ohhgood.store/"}};
  const jsonLd=document.createElement("script");jsonLd.type="application/ld+json";jsonLd.textContent=JSON.stringify(schema);document.head.appendChild(jsonLd);
 }catch(error){console.error("Ohhgood! journal story could not be loaded:",error);setMeta('meta[name="robots"]',"content","no"+"index,follow");title.textContent="Unable to load this story.";summary.textContent="";body.textContent="Please refresh in a moment.";}
})();
</script>
</body>
</html>
